; --------------------------------------------------------------------------
; MQTT Subscriber - af-gps-tracker
; --------------------------------------------------------------------------
; Proses inti penerima data GPS (php artisan mqtt:subscribe). Ini yang
; harus hidup 24/7 - kalau proses ini mati, seluruh sistem berhenti
; menerima lokasi kendaraan sampai dihidupkan lagi. Sudah mendukung
; auto-reconnect ke MQTT broker sendiri (lihat config/mqtt.php), tapi
; kalau proses PHP-nya sendiri yang mati (crash, server restart),
; Supervisor ini yang menghidupkannya lagi.
;
; PENTING: numprocs WAJIB 1. Menjalankan lebih dari satu instance dengan
; client_id MQTT yang sama (config/mqtt.php: MQTT_CLIENT_ID) akan membuat
; broker memutus salah satu koneksi setiap kali instance baru connect,
; bukan memproses pesan lebih cepat.
;
; Install:
;   sudo cp deploy/supervisor/af-gps-tracker-mqtt.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start af-gps-tracker-mqtt
; --------------------------------------------------------------------------

[program:af-gps-tracker-mqtt]

; GANTI /path/to/af-gps-tracker sesuai lokasi project di server.
command=php /path/to/af-gps-tracker/artisan mqtt:subscribe

; Wajib 1 - lihat catatan di atas.
numprocs=1

autostart=true
autorestart=true

; Selalu coba lagi tanpa batas - ini proses kritis, tidak boleh berhenti
; permanen hanya karena sempat gagal restart beberapa kali berturut-turut.
startretries=1000000000
startsecs=5

; GANTI sesuai user yang menjalankan aplikasi di server ini.
user=www-data

redirect_stderr=true

; GANTI /path/to/af-gps-tracker sesuai lokasi project.
stdout_logfile=/path/to/af-gps-tracker/storage/logs/mqtt-subscribe.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
