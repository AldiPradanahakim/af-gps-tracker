; --------------------------------------------------------------------------
; Queue Worker - af-gps-tracker
; --------------------------------------------------------------------------
; Mengirim email/WhatsApp (SendNotificationEmailJob, SendNotificationWhatsappJob),
; menyiarkan lokasi realtime ke browser (VehicleLocationUpdated), dan
; menyelesaikan alamat reverse-geocoding di background (ResolveGpsAddressJob).
; Tanpa proses ini jalan, semua hal di atas cuma menumpuk di tabel `jobs`
; dan tidak pernah benar-benar terkirim/tampil.
;
; Install:
;   sudo cp deploy/supervisor/af-gps-tracker-queue.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start af-gps-tracker-queue:*
;
; Setelah setiap deploy kode baru, WAJIB restart supaya worker pakai kode
; terbaru (proses PHP yang sudah berjalan lama tetap pakai kode versi lama
; di memori sampai di-restart):
;   php artisan queue:restart
;   (Supervisor otomatis menghidupkan ulang worker setelah restart signal)
; --------------------------------------------------------------------------

[program:af-gps-tracker-queue]
process_name=%(program_name)s_%(process_num)02d

; GANTI /path/to/af-gps-tracker sesuai lokasi project di server.
command=php /path/to/af-gps-tracker/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=90

; Jumlah worker paralel. 1 cukup untuk skala kecil-menengah (puluhan
; kendaraan). Naikkan kalau notifikasi/broadcast mulai terasa tertunda.
numprocs=1

autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600

; GANTI sesuai user yang menjalankan PHP-FPM/web server di server ini
; (mis. www-data di Ubuntu/Debian, atau user aplikasi dedicated).
user=www-data

redirect_stderr=true

; GANTI /path/to/af-gps-tracker sesuai lokasi project.
stdout_logfile=/path/to/af-gps-tracker/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
